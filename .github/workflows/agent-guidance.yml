# Pin this workflow's merged commit in the organisation required-workflows ruleset.
# Embedded helpers keep the check independent of the repository being inspected.
name: Agent Guidance

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  agent-guidance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch the pull request into a fresh clone
        env:
          FRESH_CLONE_TOKEN: ${{ github.token }}
          PR_MERGE: ${{ github.sha }}
        run: |
          clone="$RUNNER_TEMP/fresh-clone.sh"
          cat > "$clone" <<'CLONE'
          #!/usr/bin/env bash
          # Fetches the pull request into a new, empty repository for a required workflow, instead of
          # trusting the runner's workspace. The self-hosted runners are shared and keep each repository's
          # workspace between jobs, so another job may leave it blob-less (filtered), shallow or otherwise
          # altered; actions/checkout reuses such a .git, a later read needs a blob the job can no longer
          # fetch, and the check fails. Needs only bash and git (2.32 or later).
          #   fresh-clone.sh DEST URL [--depth N] [--checkout COMMIT] REFSPEC...
          # DEST is removed and created afresh, with origin at URL, then REFSPECs are fetched in one go:
          # never with a filter, with full history unless --depth limits it. --checkout detaches HEAD at
          # COMMIT with its files; without it there is no working tree checkout. FRESH_CLONE_TOKEN, when
          # set, authenticates that one fetch through a header exported only for it, so it is never
          # written to .git/config or any process's command line. The runner user's global and system git config are ignored.
          set -euo pipefail
          export LC_ALL=C GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 GIT_TERMINAL_PROMPT=0
          unset GIT_DIR GIT_WORK_TREE GIT_INDEX_FILE GIT_OBJECT_DIRECTORY GIT_ALTERNATE_OBJECT_DIRECTORIES \
            GIT_CONFIG_PARAMETERS GIT_CONFIG_COUNT
          fail() { echo "fresh-clone: $*" >&2; exit 2; }
          usage="usage: fresh-clone.sh DEST URL [--depth N] [--checkout COMMIT] REFSPEC..."
          
          [ $# -ge 2 ] || fail "$usage"
          dest=$1 url=$2; shift 2
          depth=() commit=""
          while [ $# -gt 0 ]; do
            case $1 in
              --depth) [[ ${2:-} =~ ^[1-9][0-9]*$ ]] || fail "--depth needs a positive number"; depth=(--depth "$2"); shift 2 ;;
              --checkout) [ -n "${2:-}" ] || fail "$usage"; commit=$2; shift 2 ;;
              -*) fail "$usage" ;;
              *) break ;;
            esac
          done
          [ $# -gt 0 ] || fail "$usage"
          
          rm -rf "$dest"
          git init -q "$dest"
          git -C "$dest" remote add origin "$url"
          # The header is exported only around the fetch, never passed as an argument: the runners' users
          # share /proc, where any process's command line is readable but its environment is not.
          # printf and echo are builtins, so the token is in no command line here either.
          if [ -n "${FRESH_CLONE_TOKEN:-}" ]; then
            basic=$(printf 'x-access-token:%s' "$FRESH_CLONE_TOKEN" | base64 | tr -d '\n')
            echo "::add-mask::$basic"
            export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraHeader GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $basic"
          fi
          fetched=0
          git -C "$dest" fetch --quiet --no-tags --no-recurse-submodules "${depth[@]}" origin "$@" && fetched=1
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0 basic
          [ "$fetched" -eq 1 ] || fail "could not fetch $* from $url"
          if [ -n "$commit" ]; then git -C "$dest" checkout --quiet --detach "$commit" -- ||
            fail "could not check out $commit"; fi
          
          # The new repository must be complete: no promisor remote or filter, and full history unless
          # --depth asked for less (a short history fetched with --depth is not shallow).
          if git -C "$dest" config --get-regexp '^(remote\..*\.(promisor|partialclonefilter)|extensions\.partialclone)$'; then
            fail "the new clone is a partial clone"
          fi
          if [ ${#depth[@]} -eq 0 ] && [ "$(git -C "$dest" rev-parse --is-shallow-repository)" != false ]; then
            fail "the new clone is shallow"
          fi
          echo "fresh-clone: fetched $* into $dest${depth[*]:+ (${depth[*]})}${commit:+, checked out $commit}"
          CLONE
          chmod +x "$clone"
          "$clone" "$RUNNER_TEMP/pr" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" --depth 1 --checkout "$PR_MERGE" \
            "+$PR_MERGE:refs/check/merge"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"

      - name: Check agent guidance
        working-directory: ${{ runner.temp }}/pr
        env:
          TIKTOKEN_CACHE_DIR: ${{ runner.tool_cache }}/tiktoken
        run: |
          engine="$RUNNER_TEMP/check-agent-guidance.py"
          cat > "$engine" <<'ENGINE'
          # /// script
          # requires-python = ">=3.10"
          # dependencies = ["tiktoken==0.14.0"]
          # ///
          """Check committed agent guidance, recursively, including monorepo projects.
          
          Run: uv run --no-config --script scripts/check-agent-guidance.py [--ref HEAD]
          The 400-token budget uses the org's o200k_base x 1.5 convention, rounded up.
          Missing guidance is fine; a CLAUDE.md needs a tracked sibling AGENTS.md.
          """
          
          import argparse
          import json
          import os
          import subprocess
          import sys
          
          LIMIT = 400
          MAX_BYTES = 1_000_000
          NAMES = {"agents.md": "AGENTS.md", "claude.md": "CLAUDE.md"}
          REASON = """Keep repository instructions small and specific to this repository.
          Strongly prefer user-level agent instructions for rules likely to apply to many
          repositories. As a guiding heuristic, if a rule is not important enough for
          user-level instructions, consider not writing it down anywhere; genuine
          repository-specific constraints are the exception.
          Documentation must not purport to describe the current code, repository layout,
          or structure. Read the code instead. Record reasons for decisions and important
          constraints that the code cannot explain. Plans and specs are dated snapshots
          of intent, never authoritative descriptions of the current system: later user
          instructions and discoveries can supersede them. Do not maintain them as a
          second source of truth for the implementation.
          Move broadly applicable rules to user-level instructions, remove code narration,
          and keep only essential repository-specific guidance in AGENTS.md.
          CLAUDE.md must contain only @AGENTS.md (an optional final newline is allowed).
          There are no baseline or exemption files for this check."""
          
          
          def git(*args: str) -> bytes:
              return subprocess.check_output(
                  ["git", *args], env={**os.environ, "GIT_NO_REPLACE_OBJECTS": "1"}
              )
          
          
          def main() -> int:
              parser = argparse.ArgumentParser(description=__doc__)
              parser.add_argument("--ref", default="HEAD", help="committed revision to check (default: HEAD)")
              args = parser.parse_args()
              tree = git("rev-parse", "--verify", "--end-of-options", f"{args.ref}^{{tree}}")
              rows = git("ls-tree", "-r", "-z", "--full-tree", tree.decode().strip())
              files = {}
              for row in rows.split(b"\0"):
                  if not row:
                      continue
                  metadata, path = row.split(b"\t", 1)
                  mode, kind, oid = metadata.split()
                  name = path.rsplit(b"/", 1)[-1].lower()
                  if name in (b"agents.md", b"claude.md"):
                      files[path] = (mode, kind, oid)
          
              failures = 0
          
              def fail(path: bytes, message: str) -> None:
                  nonlocal failures
                  failures += 1
                  # Quote control characters so a path cannot forge log lines or annotations.
                  label = json.dumps(os.fsdecode(path), ensure_ascii=True)
                  print(f"[FAIL] {label}: {message}")
          
              encoder = None
              for path, (mode, kind, oid) in sorted(files.items()):
                  name = path.rsplit(b"/", 1)[-1].decode("ascii")
                  expected = NAMES[name.lower()]
                  if name != expected:
                      fail(path, f"use the canonical filename {expected}")
                  if mode not in (b"100644", b"100755") or kind != b"blob":
                      fail(path, "guidance must be a regular tracked file, not a symlink or submodule")
                      continue
                  size = int(git("cat-file", "-s", oid.decode()))
                  if size > MAX_BYTES:
                      fail(path, "guidance exceeds 1 MB; shorten it before measuring tokens")
                      continue
                  data = git("cat-file", "blob", oid.decode())
                  try:
                      text = data.decode("utf-8")
                  except UnicodeDecodeError:
                      fail(path, "guidance must be UTF-8 text")
                      continue
                  if expected == "CLAUDE.md":
                      if text.replace("\r\n", "\n") not in ("@AGENTS.md", "@AGENTS.md\n"):
                          fail(path, "must contain only @AGENTS.md, with an optional final newline")
                      sibling = path.rsplit(b"/", 1)[0] + b"/AGENTS.md" if b"/" in path else b"AGENTS.md"
                      if sibling not in files:
                          fail(path, "the imported sibling AGENTS.md must be tracked")
                      continue
                  if encoder is None:
                      import tiktoken
          
                      encoder = tiktoken.get_encoding("o200k_base")
                  raw = len(encoder.encode_ordinary(text))
                  count = (raw * 3 + 1) // 2
                  label = json.dumps(os.fsdecode(path), ensure_ascii=True)
                  print(f"agent-guidance: {label}: {count}/{LIMIT} tokens")
                  if count > LIMIT:
                      fail(path, f"{count} tokens exceeds {LIMIT} (tiktoken o200k_base x 1.5, rounded up)")
          
              print(f"agent-guidance: {len(files)} guidance file(s) checked recursively, {failures} failure(s)")
              if failures:
                  print("\n" + REASON)
                  return 1
              print("agent-guidance: ok")
              return 0
          
          
          if __name__ == "__main__":
              try:
                  sys.exit(main())
              except (OSError, subprocess.CalledProcessError, ValueError) as error:
                  print(f"agent-guidance: could not complete the check: {error}", file=sys.stderr)
                  sys.exit(2)
          ENGINE
          status=0
          uv run --no-config --no-project --quiet --python 3.12 --script "$engine" > "$RUNNER_TEMP/agent-guidance-report.txt" 2>&1 || status=$?
          cat "$RUNNER_TEMP/agent-guidance-report.txt"
          {
            echo '## Agent guidance'
            echo '```text'
            cat "$RUNNER_TEMP/agent-guidance-report.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

# Org no-binaries check, a candidate required workflow
#
# Like file-lengths.yml, an org ruleset's "Require workflows to pass" rule can
# point at this file in malcomsonbrothers/org-checks at a pinned commit, so it
# runs on every pull request in every org repository, in the context of that
# repository. It also runs on this repository's own pull requests.
#
# Binaries, media, 3D and Blender files, model weights, archives, compiled
# code, databases, documents, secrets and junk do not belong in git. It checks
# every commit from the base to the pull request head (rebase merges keep each
# commit, so a file added and later deleted still fails), skipping commits
# already on the default branch, and fails on every added, modified, copied or
# renamed file that is binary (a NUL byte in the first 8 KB) or media by its
# first bytes, has a denied name or folder from scripts/lists/no-binaries.txt
# (even as text or a Git LFS pointer), or is over 1 MB. Files already in the
# repository never fail it. Favicons and app icons up to 64 KB with image
# content pass without config; anything else needs an `allow <glob> <reason>`
# row (or `exempt <glob> <reason>` for a generated file over 1 MB) in
# .binary-allow at the head (or projects/<p>/.binary-allow, relative to its
# folder).
#
# .binary-allow may only shrink against the pull request base (rows the
# default branch tip has passed there and count as old too): a new row fails
# unless the pull request has the binary-exception label. Required workflows
# ignore labeled events, so after adding it close and reopen the pull request
# to re-run.
#
# It needs no credentials and runs on GitHub-hosted runners. The engine below
# is scripts/check-binaries.sh and its lists scripts/lists/no-binaries.txt,
# embedded so the job fetches nothing and the ruleset's pinned commit pins
# both. After editing either, paste it back between <<'ENGINE' and ENGINE (or
# <<'LISTS' and LISTS) indented ten spaces; likewise scripts/fresh-clone.sh
# between <<'CLONE' and CLONE.

name: No Binaries

on:
  pull_request:
    # Required workflows ignore labeled/unlabeled events, so after adding the
    # binary-exception label, close and reopen the pull request to re-run.
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  no-binaries:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # A new clone in the job's temporary directory (see scripts/fresh-clone.sh,
      # embedded like the engine: paste it back after editing).
      - name: Fetch the pull request into a fresh clone
        env:
          FRESH_CLONE_TOKEN: ${{ github.token }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          clone="$RUNNER_TEMP/fresh-clone.sh"
          cat > "$clone" <<'CLONE'
          #!/usr/bin/env bash
          # Fetches the pull request into a new, empty repository for a required workflow, instead of
          # trusting the runner's workspace. The self-hosted runners are shared and keep each repository's
          # workspace between jobs, so another job may leave it blob-less (filtered), shallow or otherwise
          # altered; actions/checkout reuses such a .git, a later read needs a blob the job can no longer
          # fetch, and the check fails. Needs only bash and git (2.32 or later).
          #   fresh-clone.sh DEST URL [--depth N] [--checkout COMMIT] REFSPEC...
          # DEST is removed and created afresh, with origin at URL, then REFSPECs are fetched in one go:
          # never with a filter, with full history unless --depth limits it. --checkout detaches HEAD at
          # COMMIT with its files; without it there is no working tree checkout. FRESH_CLONE_TOKEN, when
          # set, authenticates that one fetch through a header exported only for it, so it is never
          # written to .git/config or any process's command line. The runner user's global and system git config are ignored.
          set -euo pipefail
          export LC_ALL=C GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 GIT_TERMINAL_PROMPT=0
          unset GIT_DIR GIT_WORK_TREE GIT_INDEX_FILE GIT_OBJECT_DIRECTORY GIT_ALTERNATE_OBJECT_DIRECTORIES \
            GIT_CONFIG_PARAMETERS GIT_CONFIG_COUNT
          fail() { echo "fresh-clone: $*" >&2; exit 2; }
          usage="usage: fresh-clone.sh DEST URL [--depth N] [--checkout COMMIT] REFSPEC..."

          [ $# -ge 2 ] || fail "$usage"
          dest=$1 url=$2; shift 2
          depth=() commit=""
          while [ $# -gt 0 ]; do
            case $1 in
              --depth) [[ ${2:-} =~ ^[1-9][0-9]*$ ]] || fail "--depth needs a positive number"; depth=(--depth "$2"); shift 2 ;;
              --checkout) [ -n "${2:-}" ] || fail "$usage"; commit=$2; shift 2 ;;
              -*) fail "$usage" ;;
              *) break ;;
            esac
          done
          [ $# -gt 0 ] || fail "$usage"

          rm -rf "$dest"
          git init -q "$dest"
          git -C "$dest" remote add origin "$url"
          # The header is exported only around the fetch, never passed as an argument: the runners' users
          # share /proc, where any process's command line is readable but its environment is not.
          # printf and echo are builtins, so the token is in no command line here either.
          if [ -n "${FRESH_CLONE_TOKEN:-}" ]; then
            basic=$(printf 'x-access-token:%s' "$FRESH_CLONE_TOKEN" | base64 | tr -d '\n')
            echo "::add-mask::$basic"
            export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraHeader GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $basic"
          fi
          fetched=0
          git -C "$dest" fetch --quiet --no-tags --no-recurse-submodules "${depth[@]}" origin "$@" && fetched=1
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0 basic
          [ "$fetched" -eq 1 ] || fail "could not fetch $* from $url"
          if [ -n "$commit" ]; then git -C "$dest" checkout --quiet --detach "$commit" -- ||
            fail "could not check out $commit"; fi

          # The new repository must be complete: no promisor remote or filter, and full history unless
          # --depth asked for less (a short history fetched with --depth is not shallow).
          if git -C "$dest" config --get-regexp '^(remote\..*\.(promisor|partialclonefilter)|extensions\.partialclone)$'; then
            fail "the new clone is a partial clone"
          fi
          if [ ${#depth[@]} -eq 0 ] && [ "$(git -C "$dest" rev-parse --is-shallow-repository)" != false ]; then
            fail "the new clone is shallow"
          fi
          echo "fresh-clone: fetched $* into $dest${depth[*]:+ (${depth[*]})}${commit:+, checked out $commit}"
          CLONE
          chmod +x "$clone"
          # Full history (every commit in BASE..HEAD, and the merges' parents), no checkout, plus
          # the default branch, whose commits the engine skips and whose .binary-allow rows count as old.
          "$clone" "$RUNNER_TEMP/pr" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            "+$PR_HEAD:refs/check/head" "+$PR_BASE:refs/check/base" \
            "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"

      - name: Check for binaries
        working-directory: ${{ runner.temp }}/pr
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BINARIES_EXCEPTION: ${{ contains(github.event.pull_request.labels.*.name, 'binary-exception') }}
          BINARIES_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          export BINARIES_LISTS="$RUNNER_TEMP/no-binaries.txt"
          cat > "$BINARIES_LISTS" <<'LISTS'
          # Org lists for scripts/check-binaries.sh. Data only: extend a list by adding a line. No repository
          # can change them; a repository allows a path with an allow row in .binary-allow instead.
          #
          # Lines (# starts a comment; patterns are matched against the lower-cased file name, or for dir
          # against each folder name in the path; * is any run of characters, ? one, [..] a class):
          #   about <category> <description>   how a failure in the category is described
          #   deny <category> <pattern>        a file name that fails even when it is text or a Git LFS pointer
          #   keep <pattern>                   a file name never denied by name (content and size still count)
          #   dir <category> <pattern>         a folder name nothing may be committed under
          #   rootdir <category> <pattern>     the same, but only at the repository root or a projects/<p>/ root
          #   magic <category> <hex pattern> <name...>   first bytes (lower-case hex) of a media file
          #   magicnul <category> <hex pattern> <name...>   the same, only for a file with a NUL byte (for
          #                                    magics that are plain ASCII, so text may start with them)
          #   icon <pattern>                   a favicon or app icon name (passes when small and an image)
          #   icondir <pattern>                a folder whose images are app icons
          #   iconext <extension>              an image extension a favicon or app icon may have
          #   tokenfile <pattern>              a config file that fails when it holds a literal token

          about media image, video or audio (belongs in R2 or the local test corpus)
          about image image content (belongs in R2 or the local test corpus)
          about 3d 3D, Blender or texture file (keep it in R2 or a project store)
          about model model weights or array data (keep them in R2 or a model store)
          about archive archive or package (publish it to a registry or R2 instead)
          about compiled compiled or object code (build it in CI instead)
          about database database file (seed it from SQL or a script instead)
          about office office document or PDF (keep it in a document store)
          about secret secret, key or state file (keep it in SSM or a secret store, and rotate it if real)
          about junk editor, OS or tool junk (delete it and add it to .gitignore)
          about dir build output or dependency folder (add it to .gitignore)
          about font font (list it in .binary-allow if the repository must ship it)
          about lfs Git LFS pointer (keep binaries out of LFS too)
          about binary binary content, a NUL byte in the first 8 KB
          about size file over 1 MB (list it as allow, or as exempt when generated, in .binary-allow)

          # Media
          deny media *.png
          deny media *.jpg
          deny media *.jpeg
          deny media *.webp
          deny media *.gif
          deny media *.avif
          deny media *.heic
          deny media *.heif
          deny media *.bmp
          deny media *.tif
          deny media *.tiff
          deny media *.ico
          deny media *.jxl
          deny media *.mp4
          deny media *.mov
          deny media *.webm
          deny media *.mkv
          deny media *.avi
          deny media *.m4v
          deny media *.mpg
          deny media *.mpeg
          deny media *.wmv
          deny media *.flv
          deny media *.3gp
          deny media *.wav
          deny media *.mp3
          deny media *.m4a
          deny media *.aac
          deny media *.ogg
          deny media *.oga
          deny media *.flac
          deny media *.opus
          deny media *.aif
          deny media *.aiff
          deny media *.wma

          # Blender and 3D (with Blender's numbered backups and autosaves)
          deny 3d *.blend
          deny 3d *.blend[1-9]
          deny 3d *.blend[1-3][0-9]
          deny 3d *.blend@
          deny 3d *.fbx
          deny 3d *.obj
          deny 3d *.mtl
          deny 3d *.glb
          deny 3d *.gltf
          deny 3d *.usd
          deny 3d *.usda
          deny 3d *.usdc
          deny 3d *.usdz
          deny 3d *.abc
          deny 3d *.ply
          deny 3d *.stl
          deny 3d *.3ds
          deny 3d *.dae
          deny 3d *.max
          deny 3d *.ma
          deny 3d *.mb
          deny 3d *.c4d
          deny 3d *.x3d
          # Blender caches and textures
          deny 3d *.vdb
          deny 3d *.bphys
          deny 3d *.exr
          deny 3d *.hdr
          deny 3d *.tga
          deny 3d *.dds
          deny 3d *.ktx
          deny 3d *.ktx2
          deny 3d *.psd
          deny 3d *.kra
          deny 3d *.xcf
          deny 3d *.sbsar
          deny 3d *.spp
          dir 3d autosave
          dir 3d blendcache_*

          # Model weights and arrays
          deny model *.onnx
          deny model *.pt
          deny model *.pth
          deny model *.ckpt
          deny model *.safetensors
          deny model *.gguf
          deny model *.ggml
          deny model *.h5
          deny model *.tflite
          deny model *.pb
          deny model *.mlmodel
          deny model *.bin
          deny model *.npy
          deny model *.npz
          deny model *.pkl
          deny model *.joblib

          # Archives and packages
          deny archive *.zip
          deny archive *.tar
          deny archive *.gz
          deny archive *.tgz
          deny archive *.bz2
          deny archive *.xz
          deny archive *.zst
          deny archive *.7z
          deny archive *.rar
          deny archive *.jar
          deny archive *.war
          deny archive *.whl
          deny archive *.egg
          deny archive *.deb
          deny archive *.rpm
          deny archive *.dmg
          deny archive *.iso
          deny archive *.apk
          deny archive *.ipa

          # Compiled
          deny compiled *.so
          deny compiled *.dylib
          deny compiled *.dll
          deny compiled *.exe
          deny compiled *.o
          deny compiled *.a
          deny compiled *.lib
          deny compiled *.class
          deny compiled *.pyc
          deny compiled *.pyo
          deny compiled *.wasm

          # Databases
          deny database *.sqlite
          deny database *.sqlite3
          deny database *.db
          deny database *.mdb

          # Office and PDF
          deny office *.pdf
          deny office *.doc
          deny office *.docx
          deny office *.xls
          deny office *.xlsx
          deny office *.ppt
          deny office *.pptx
          deny office *.numbers
          deny office *.pages

          # Secrets (.key is also Keynote)
          deny secret *.pem
          deny secret *.key
          deny secret *.p12
          deny secret *.pfx
          deny secret *.jks
          deny secret *.keystore
          deny secret id_rsa
          deny secret id_dsa
          deny secret id_ecdsa
          deny secret id_ed25519
          deny secret .env
          deny secret .env.*
          keep .env.example
          keep .env.sample
          keep .env.template
          deny secret *.tfstate
          deny secret *.tfstate.backup
          tokenfile .npmrc
          tokenfile .pypirc

          # Junk
          deny junk .ds_store
          deny junk ._*
          deny junk thumbs.db
          deny junk desktop.ini
          deny junk *.orig
          deny junk *.rej
          deny junk *.bak
          deny junk *.swp
          deny junk *.swo
          deny junk *~
          deny junk *.log
          deny junk *.tmp

          # Fonts: binary, so they fail unless allowed by a row
          deny font *.woff
          deny font *.woff2
          deny font *.ttf
          deny font *.otf
          deny font *.eot

          # Build output and dependency folders
          dir dir node_modules
          dir dir __pycache__
          dir dir .venv
          # Common source folder names deeper down (crates/build, src/dist), so only at a root
          rootdir dir target
          rootdir dir dist
          rootdir dir build
          dir dir .svelte-kit
          dir dir .terraform

          # Content: first bytes of media files, whatever the extension
          magic image 89504e47* PNG
          magic image ffd8ff* JPEG
          magicnul image 47494638* GIF
          magicnul image 52494646????????57454250* WebP
          magic image 00000100* ICO
          magic image 424d????????00000000* BMP
          magic image 49492a00* TIFF
          magic image 4d4d002a* TIFF
          magic image ff0a* JPEG XL
          magic image 0000000c4a584c20* JPEG XL
          magicnul 3d 38425053* PSD
          magicnul 3d 424c454e444552* Blender
          magicnul media 52494646????????57415645* WAV
          magicnul media 52494646????????41564920* AVI
          magic media ????????66747970* ISO media (MP4, MOV, M4A, 3GP, HEIC or AVIF)
          magic media 1a45dfa3* Matroska (MKV or WebM)
          magicnul media 4f676753* Ogg
          magicnul media 664c6143* FLAC
          magicnul media 464f524d????????4149464[63]* AIFF
          magic media 3026b2758e66cf11* ASF (WMV or WMA)
          magic media 464c5601* FLV
          magic media 000001ba* MPEG video
          magic media 000001b3* MPEG video
          magicnul media 494433* MP3 (ID3)
          # MPEG or AAC frame sync (ffe0 to ffff), but not fffe, the UTF-16 byte order mark
          magic media ffe* MPEG or AAC audio
          magic media fff[0-9a-df]* MPEG or AAC audio

          # Favicons and app icons: up to 64 KB, image content (or plain SVG), never an LFS pointer
          icon favicon.*
          icon apple-touch-icon*
          icon apple-icon*
          icon icon.*
          icon icon-*
          icon android-chrome-*
          icon mstile-*
          icon *.ico
          icondir *.appiconset
          iconext png
          iconext ico
          iconext svg
          iconext jpg
          iconext jpeg
          iconext gif
          iconext webp
          iconext avif
          LISTS
          engine="$RUNNER_TEMP/check-binaries.sh"
          cat > "$engine" <<'ENGINE'
          #!/usr/bin/env bash
          # Org-wide no-binaries check. Needs only bash, git, awk, od and grep. Binaries, media, 3D and
          # Blender files, model weights, archives, compiled code, databases, documents, secrets and junk
          # do not belong in git. Fails when any commit in BASE..TIP adds, modifies or renames into place
          # (rebase merges keep every commit, so a file added and then deleted still fails):
          #   1. any binary (a NUL byte in the first 8 KB, git's own test) or media by its first bytes
          #   2. a denied file name or folder from the org lists, even when it is text or a Git LFS pointer
          #   3. any file over 1 MB
          # Small favicons and app icons with image content pass; anything else needs a row. Never skips.
          #   check-binaries.sh [BASE [TIP]]   commits in BASE..TIP (TIP defaults to HEAD)
          #   check-binaries.sh --ci BASE TIP  the same, and .binary-allow may not add rows compared with
          #                                    BASE or the default branch tip. BINARIES_EXCEPTION=true (the
          #                                    PR label) allows new rows.
          # The org lists are data: BINARIES_LISTS, else lists/no-binaries.txt beside this script, else the
          # copy on org-checks master. Commits already on the default branch are skipped: they passed in
          # their own pull request. A merge counts only files that differ from every parent. A missing BASE
          # falls back to the merge-base with the default branch (BINARIES_DEFAULT_BRANCH, else origin/HEAD,
          # origin/main or origin/master); with none, every commit reachable from TIP is checked.
          # .binary-allow lines, read at TIP (# starts a comment):
          #   allow <glob> <reason...>    the path may be anything above
          #   exempt <glob> <reason...>   a generated file (OpenAPI JSON, say) may be over 1 MB
          # Globs: * is one path segment, ** any depth; other characters are literal. Each
          # projects/<p>/.binary-allow adds rows relative to its folder.
          set -euo pipefail
          export LC_ALL=C

          size_max=1048576 icon_max=65536 svg_max=20480
          empty_tree=4b825dc642cb6eb9a060e54bf8d69288fbee4904
          raw_lists=https://raw.githubusercontent.com/malcomsonbrothers/org-checks/master/scripts/lists/no-binaries.txt

          here=$(cd "$(dirname "${BASH_SOURCE[0]:-.}")" 2>/dev/null && pwd || :)
          cd "$(git rev-parse --show-toplevel)"
          config=.binary-allow
          tmp=$(mktemp -d); trap 'rm -rf "$tmp"' EXIT
          fail() { echo "no-binaries: $*" >&2; exit 2; }
          usage="usage: check-binaries.sh [--ci] [BASE [TIP]]"

          lists=${BINARIES_LISTS:-$here/lists/no-binaries.txt}
          if [ ! -f "$lists" ]; then
            [ -z "${BINARIES_LISTS:-}" ] || fail "BINARIES_LISTS names no file: $lists"
            curl -fsSL "$raw_lists" -o "$tmp/lists" || fail "no lists/no-binaries.txt beside the script and could not fetch $raw_lists"
            lists=$tmp/lists
          fi

          default_branch() {
            local b d=${BINARIES_DEFAULT_BRANCH:-}
            for b in ${d:+"origin/$d" "$d"} "$(git symbolic-ref -q --short refs/remotes/origin/HEAD || :)" \
              origin/main origin/master; do
              [ -n "$b" ] && git rev-parse -q --verify "$b^{commit}" >/dev/null && { echo "$b"; return; }
            done
            return 0
          }

          # Turns a .binary-allow text (stdin) at path CFG in commit REF, with globs relative to folder PRE,
          # into rule records:   A|E regex glob config (allow or exempt row) | X error
          parse_rules() {
            awk -v cfg="$1" -v pre="${2:-}" -v ref="${3:-}" '
              function glob_re(g,   r, c, i) {
                r = ""
                for (i = 1; i <= length(g); i++) {
                  c = substr(g, i, 1)
                  if (c == "*" && substr(g, i, 3) == "**/") { r = r "(.*/)?"; i += 2 }
                  else if (c == "*" && substr(g, i, 2) == "**") { r = r ".*"; i++ }
                  else if (c == "*") r = r "[^/]*"
                  else if (c == "?") r = r "[^/]"
                  else if (index("\\.[]()+{}|^$", c)) r = r "\\" c
                  else r = r c
                }
                return "^" r "$"
              }
              { sub(/\r$/, "") }
              /^[ \t]*(#|$)/ { next }
              ($1 == "allow" || $1 == "exempt") && NF >= 3 { print ($1 == "allow" ? "A " : "E ") glob_re(pre $2) " " $2 " " cfg; next }
              { print "X " ref ":" cfg ":" NR ": unknown or malformed line (only allow or exempt <glob> <reason>): " $0 }'
          }

          # Prints the rule records of .binary-allow and each projects/<p>/.binary-allow at commit REF.
          rules_at() {
            local f
            git ls-tree -r --name-only "$1" -- "$config" projects | awk '/^(projects\/[A-Za-z0-9_-][A-Za-z0-9._-]*\/)?\.binary-allow$/' |
              while IFS= read -r f; do git show "$1:$f" | parse_rules "$f" "${f%"$config"}" "$1"; done
          }

          ci=0
          if [ "${1:-}" = --ci ]; then ci=1; shift; fi
          case ${1:-} in -*) fail "$usage" ;; esac
          [ $# -le 2 ] || fail "$usage"
          [ "$ci" -eq 0 ] || [ $# -eq 2 ] || fail "$usage"
          tip=$(git rev-parse -q --verify "${2:-HEAD}^{commit}") || fail "unknown commit ${2:-HEAD}"
          base=${1:-}
          if [ -z "$base" ]; then d=$(default_branch); base=${d:+$(git merge-base "$tip" "$d" || :)}
          else git cat-file -e "$base^{commit}" 2>/dev/null || fail "base commit $base is not in this clone; fetch it"
            [ "$ci" -eq 1 ] || base=$(git merge-base "$base" "$tip" || :)
          fi

          rules_at "$tip" > "$tmp/rules"
          status=0
          if grep -q '^X ' "$tmp/rules"; then sed -n 's/^X /[FAIL] /p' "$tmp/rules"; status=1; fi

          # Prints each added, modified, copied or renamed regular file from tree-ish FROM to commit TO as
          # sha TAB path (renames detected, so a move counts at its new path; a mode-only change and
          # deletions count nothing), and WEIRD for a path with a tab or newline.
          changes() {
            local head omode nmode osha nsha st path
            git diff-tree -r -M --no-abbrev --raw -z "$1" "$2" > "$tmp/raw"
            while IFS= read -r -d '' head; do
              read -r omode nmode osha nsha st <<< "${head#:}"
              IFS= read -r -d '' path
              case $st in R* | C*) IFS= read -r -d '' path ;; esac
              case $st in D*) continue ;; esac
              case $nmode in 100644 | 100755) ;; *) continue ;; esac
              [ "$osha" != "$nsha" ] || [ "$omode" = 000000 ] || case $st in R* | C*) ;; *) continue ;; esac
              if [[ $path == *$'\t'* || $path == *$'\n'* ]]; then echo WEIRD; continue; fi
              printf '%s\t%s\n' "$nsha" "$path"
            done < "$tmp/raw"
          }

          # Every commit in BASE..TIP not already on the default branch; a merge keeps only the files that
          # differ from every parent (what it adds beyond its parents), a root commit diffs the empty tree.
          dflt=$(default_branch)
          git rev-list --reverse ${base:+"^$base"} ${dflt:+"^$dflt"} "$tip" > "$tmp/commits"
          : > "$tmp/all"; commits=0
          while IFS= read -r c; do
            commits=$((commits + 1))
            read -r -a ps < <(git rev-list --parents -n 1 "$c")
            [ "${#ps[@]}" -gt 1 ] || ps+=("$empty_tree")
            changes "${ps[1]}" "$c" > "$tmp/c"
            for p in "${ps[@]:2}"; do
              changes "$p" "$c" > "$tmp/p"
              awk 'FILENAME == ARGV[1] { a[$0] = 1; next } $0 in a' "$tmp/p" "$tmp/c" > "$tmp/both"; mv "$tmp/both" "$tmp/c"
            done
            cat "$tmp/c" >> "$tmp/all"
          done < "$tmp/commits"
          weird=$(grep -c '^WEIRD$' "$tmp/all" || :)
          grep -v '^WEIRD$' "$tmp/all" | sort -u > "$tmp/changed" || :
          if [ "$weird" -gt 0 ]; then echo "[FAIL] $weird changed path(s) contain a tab or newline; rename them"; status=1; fi

          # Sizes in one call, then each file's first 8 KB: a NUL byte makes it binary, the first 64 bytes
          # go to the magic patterns, and a token file is searched for a literal token (never printed).
          # Records: sha TAB size TAB nul TAB hex TAB token TAB path.
          cut -f1 "$tmp/changed" | git cat-file --batch-check='%(objectname) %(objectsize)' > "$tmp/sizes"
          awk -F '\t' 'FILENAME == ARGV[1] { split($0, w, " "); n[w[1]] = w[2]; next } { print $1 "\t" n[$1] + 0 "\t" $2 }' \
            "$tmp/sizes" "$tmp/changed" > "$tmp/sized"
          tokenfiles=" $(awk '$1 == "tokenfile" { printf "%s ", $2 }' "$lists")"
          shopt -s nocasematch
          : > "$tmp/files"; count=0
          while IFS=$'\t' read -r sha n path; do
            count=$((count + 1))
            hx=$( { git cat-file blob "$sha" 2>/dev/null || :; } | od -An -tx1 -N8000 | tr -d '\n') || :
            nul=0; [[ $hx != *" 00"* ]] || nul=1
            h=${hx// /}; h=${h:0:128}
            tok=0
            if [[ $tokenfiles == *" ${path##*/} "* ]] && { git cat-file blob "$sha" || :; } |
              grep -Eiq "(_authtoken|_auth|_password|password|token)[[:space:]]*[=:][[:space:]]*[\"']?[^\$\"'[:space:]]"; then tok=1; fi
            printf '%s\t%s\t%s\t%s\t%s\t%s\n' "$sha" "$n" "$nul" "$h" "$tok" "$path" >> "$tmp/files"
          done < "$tmp/sized"
          shopt -u nocasematch
          lfs=$(printf 'version https://git-lfs.github.com/spec/' | od -An -tx1 | tr -d ' \n')

          # Classifies each file against the org lists and the repository's rows. Prints one line per file:
          #   [FAIL] path: category: description (detail) | no-binaries: path: why it passes
          # and a closing "#" line of failure counts by category.
          awk -F '\t' -v lists="$lists" -v rules="$tmp/rules" -v lfs="$lfs" -v smax="$size_max" -v imax="$icon_max" -v svgmax="$svg_max" '
            function re(g, hex,   r, c, i) { r = ""
              for (i = 1; i <= length(g); i++) { c = substr(g, i, 1)
                if (c == "*") r = r ".*"; else if (c == "?") r = r "."
                else if (c == "[" || c == "]") r = r c
                else if (index("\\.()+{}|^$", c)) r = r "\\" c; else r = r c }
              return "^" r "$" }
            BEGIN {
              while ((getline l < lists) > 0) { split(l, w, " ")
                if (w[1] == "about") { d = l; sub(/^about [^ ]+ /, "", d); about[w[2]] = d }
                else if (w[1] == "deny") { nd++; dre[nd] = re(w[3]); dcat[nd] = w[2] }
                else if (w[1] == "keep") keep[re(w[2])] = 1
                else if (w[1] == "dir" || w[1] == "rootdir") { nf++; fre[nf] = re(w[3]); fcat[nf] = w[2]; froot[nf] = w[1] == "rootdir" }
                else if (w[1] == "magic" || w[1] == "magicnul") { nm++; m = w[3]; sub(/\*$/, "", m); mre[nm] = re(m); sub(/\$$/, "", mre[nm])
                  mcat[nm] = w[2]; mnul[nm] = w[1] == "magicnul"; d = l; sub(/^magic(nul)? [^ ]+ [^ ]+ /, "", d); mname[nm] = d }
                else if (w[1] == "icon") icon[re(w[2])] = 1
                else if (w[1] == "icondir") icondir[re(w[2])] = 1
                else if (w[1] == "iconext") iconext[w[2]] = 1 }
              while ((getline l < rules) > 0) { split(l, w, " "); if (w[1] == "A") allow[w[2]] = w[4] ": allow " w[3]
                else if (w[1] == "E") exempt[w[2]] = w[4] ": exempt " w[3] } }
            function row(p, set,   r) { for (r in set) if (p ~ r) return set[r]; return "" }
            function out(p, cat, detail) { if ((p, cat) in done) return; done[p, cat] = 1; bycat[cat]++
              print "[FAIL] " p ": " cat ": " about[cat] (detail != "" ? " (" detail ")" : "") }
            function pass(p, why) { if (!(p in passed)) print "no-binaries: " p ": " why; passed[p] = 1 }
            { sha = $1; n = $2 + 0; nul = $3; h = $4; tok = $5; p = $6; lp = tolower(p)
              k = split(lp, seg, "/"); name = seg[k]; on = p; sub(/.*\//, "", on); ext = name ~ /^[^.].*\.[^.]+$/ ? name : ""; sub(/.*\./, "", ext)
              isl = index(h, lfs) == 1; mc = ""
              for (i = 1; i <= nm && !isl; i++) if (h ~ mre[i] && (nul || !mnul[i])) { mc = mcat[i]; mn = mname[i]; break }
              why = row(p, allow); if (why != "") { pass(p, "allowed by " why); next }
              cat = ""; detail = ""
              for (j = 1; j < k && cat == ""; j++) for (i = 1; i <= nf; i++) if (seg[j] ~ fre[i] && (!froot[i] || j == 1 || (j == 3 && seg[1] == "projects"))) { cat = fcat[i]; detail = "under " seg[j] "/"; break }
              isicon = 0; for (r in icon) if (name ~ r) isicon = 1; for (j = 1; j < k; j++) for (r in icondir) if (seg[j] ~ r) isicon = 1
              if (cat == "" && isicon && (ext in iconext) && !isl && n <= imax && (mc == "" || mc == "image") && !(ext == "svg" && nul)) {
                if (!(p in passed)) icons++; pass(p, "favicon or app icon, " n " bytes"); next }
              kept = 0; for (r in keep) if (name ~ r) kept = 1
              for (i = 1; i <= nd && cat == "" && !kept; i++) if (name ~ dre[i]) { cat = dcat[i]; detail = on (mc != "" ? ", " mn " content" : "") }
              if (cat == "" && tok) { cat = "secret"; detail = on " holding a token" }
              if (cat == "" && isl) cat = "lfs"
              if (cat == "" && mc != "") { cat = mc == "image" ? "image" : mc; detail = mn " content" }
              if (cat == "" && nul) cat = "binary"
              if (cat == "" && ext == "svg" && n > svgmax) { cat = "media"; detail = "an SVG over 20 KB, " n " bytes" }
              if (cat != "") out(p, cat, detail)
              if (n > smax) { why = row(p, exempt); if (why != "") pass(p, "size allowed by " why); else out(p, "size", n " bytes") } }
            END { for (c in bycat) { s = s " " c " " bycat[c]; tot += bycat[c] }; print "# " tot + 0 " " icons + 0 s }' "$tmp/files" > "$tmp/out"
          grep -v '^# ' "$tmp/out" || :
          read -r _ nfail icons bycat < <(grep '^# ' "$tmp/out")
          echo "no-binaries: $commits commit(s), $count changed file(s) checked, $icons favicon or app icon(s)"
          if [ "$nfail" -gt 0 ]; then status=1
            echo "no-binaries: $nfail failure(s) by category:${bycat:+ $bycat}"
            echo "no-binaries: binaries, media and the other listed files do not belong in git. Put user-facing" \
              "assets in R2 (served from the CDN), test fixtures in the local test corpus, secrets in SSM, and" \
              "build output in .gitignore. Favicons and app icons up to 64 KB pass as they are. For a file that" \
              "truly must live in the repository, add 'allow <path or glob> <reason>' (or 'exempt' for a" \
              "generated file over 1 MB) to .binary-allow at the repository root (or projects/<p>/.binary-allow)" \
              "and ask a reviewer to put the binary-exception label on the pull request, then close and reopen" \
              "it so this check re-runs. Remove a committed secret and rotate it; deleting it does not unpublish it."
          fi

          # CI: each .binary-allow may only shrink against BASE; rows the default branch tip has passed there.
          if [ "$ci" -eq 1 ]; then
            for r in "$base" "$dflt"; do [ -z "$r" ] || rules_at "$r"; done | grep '^[AE] ' > "$tmp/old-rules" || true
            awk 'FILENAME == ARGV[1] { old[$1 " " $2 " " $4] = 1; next }
              $1 ~ /^[AE]$/ && !(($1 " " $2 " " $4) in old) { print $4 " new " ($1 == "A" ? "allow" : "exempt") " row " $3 }' \
              "$tmp/old-rules" "$tmp/rules" > "$tmp/added"
            if [ -s "$tmp/added" ]; then
              if [ "${BINARIES_EXCEPTION:-}" = true ]; then
                sed 's/^[^ ]* /no-binaries: allowed by the binary-exception label: /' "$tmp/added"
              else
                sed 's/^\([^ ]*\) /[FAIL] \1: /' "$tmp/added"
                echo "no-binaries: .binary-allow may only shrink. A reviewer allows a new row by putting the" \
                  "binary-exception label on the pull request, then closing and reopening it."
                status=1
              fi
            fi
          fi

          [ "$status" -eq 0 ] && echo "no-binaries: ok" || echo "no-binaries: see .binary-allow and scripts/check-binaries.sh"
          exit "$status"
          ENGINE
          chmod +x "$engine"
          status=0
          out=$("$engine" --ci "$PR_BASE" "$PR_HEAD" 2>&1) || status=$?
          printf '%s\n' "$out"
          printf '%s\n' "$out" | sed -n -e 's/%/%25/g' \
            -e "s/^\[FAIL\] \([^:]*\): \(.*\)$/::error file=\1,title=no-binaries::\2/p" \
            -e "s/^\[FAIL\] \([^:]*\)$/::error title=no-binaries::\1/p"
          {
            echo "## No binaries"
            if [ "$status" -eq 0 ]; then echo "No new binaries, media, denied files or files over 1 MB."; else
              echo "Violations (exit $status). Binaries, media and the listed file types do not belong in git:"
              echo "user-facing assets go to R2, test fixtures to the local test corpus, secrets to SSM, build"
              echo "output to .gitignore. For a file that truly must live here, add 'allow <path or glob> <reason>'"
              echo "(or 'exempt' for a generated file over 1 MB) to .binary-allow, ask a reviewer for the"
              echo "binary-exception label, then close and reopen the pull request to re-run this check"
              echo "(see the malcomsonbrothers/org-checks README)."
            fi
            echo '```'
            printf '%s\n' "$out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

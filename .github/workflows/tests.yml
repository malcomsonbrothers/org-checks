# Tests for the file length check, its git hooks, the crate token check, the sync rule helper,
# the commit size check, the pre-push release guard and the org-hooks check, the no-stubs check's copy,
# the pull request title check, the path collision check, the stale ruleset
# pin check, the fresh clone the required workflows check in, the base they
# compare with, and the copies embedded in their workflows.
# This repository's own file length check is file-lengths.yml, which runs
# on its pull requests like any other workflow.

name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: [self-hosted, Linux, light]
    timeout-minutes: 5
    steps:
      # Light runners keep HOME between jobs: each job gets a fresh one in its temporary directory.
      - name: Use a fresh home
        run: mkdir -p "$RUNNER_TEMP/home" && echo "HOME=$RUNNER_TEMP/home" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test the file length check and its hooks
        run: scripts/check-file-lengths.test.sh

      - name: Test that covered languages cannot escape the file length check
        run: scripts/check-file-lengths-languages.test.sh

      - name: Test the commit size check
        run: scripts/check-commit-size.test.sh

      - name: Test the commit size check's sync rule
        run: scripts/check-commit-size-sync.test.sh

      - name: Check the sync rule helper copies
        run: |
          for wf in commit-size crate-tokens file-lengths; do
            awk '/<<.SYNC.$/ { on = 1; next } /^ *SYNC$/ { on = 0 } on { sub(/^          /, ""); print }' ".github/workflows/$wf.yml" | cmp - scripts/sync-tip.sh
          done

      - name: Test the pre-push release guard
        run: scripts/pre-push-guards.test.sh

      - name: Test the no-binaries check
        run: scripts/check-binaries.test.sh

      - name: Test the fresh clone the required workflows check in
        run: scripts/fresh-clone.test.sh

      - name: Test the pull request title check
        run: scripts/check-pr-title.test.sh

      - name: Test the path collision check
        run: scripts/check-path-collisions.test.sh

      - name: Test the stale ruleset pin check
        run: scripts/check-ruleset-pins.test.sh

      - name: Check the org hooks pin
        run: scripts/check-org-hooks-pin.sh

      - name: Check the no-stubs workflow's engine copy
        run: |
          awk '/<<.ENGINE.$/ { on = 1; next } /^ *ENGINE$/ { on = 0 } on { sub(/^          /, ""); print }' \
            .github/workflows/no-stubs.yml | cmp - scripts/check-no-stubs.sh

      - name: Check agent guidance workflow helper copies
        run: |
          workflow=.github/workflows/agent-guidance.yml
          awk '/<<.CLONE.$/ { on = 1; next } /^ *CLONE$/ { on = 0 } on { sub(/^          /, ""); print }' "$workflow" | cmp - scripts/fresh-clone.sh
          awk '/<<.ENGINE.$/ { on = 1; next } /^ *ENGINE$/ { on = 0 } on { sub(/^          /, ""); print }' "$workflow" | cmp - scripts/check-agent-guidance.py

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Test the crate token check
        env:
          TIKTOKEN_CACHE_DIR: ${{ runner.tool_cache }}/tiktoken
        run: scripts/check-crate-tokens.test.sh

      - name: Test the crate token check's sync rule
        env:
          TIKTOKEN_CACHE_DIR: ${{ runner.tool_cache }}/tiktoken
        run: scripts/check-crate-tokens-sync.test.sh

      - name: Test that the checks compare with the current base, not a stale base.sha
        env:
          TIKTOKEN_CACHE_DIR: ${{ runner.tool_cache }}/tiktoken
        run: scripts/current-base.test.sh

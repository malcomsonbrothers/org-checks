# Tests for the file length check, its git hooks, the crate token check,
# the commit size check, the pre-push release guard and the org-hooks check,
# the pull request title check, the path collision check, the fresh clone
# the required workflows check in, and the copies embedded in their workflows.
# This repository's own file length check is file-lengths.yml, which runs
# on its pull requests like any other workflow.

name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test the file length check and its hooks
        run: scripts/check-file-lengths.test.sh

      - name: Test that covered languages cannot escape the file length check
        run: scripts/check-file-lengths-languages.test.sh

      - name: Test the commit size check
        run: scripts/check-commit-size.test.sh

      - name: Test the pre-push release guard
        run: scripts/pre-push-guards.test.sh

      - name: Test the fresh clone the required workflows check in
        run: scripts/fresh-clone.test.sh

      - name: Test the pull request title check
        run: scripts/check-pr-title.test.sh

      - name: Test the path collision check
        run: scripts/check-path-collisions.test.sh

      - name: Check the org hooks pin
        run: scripts/check-org-hooks-pin.sh

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Test the crate token check
        env:
          TIKTOKEN_CACHE_DIR: ${{ runner.tool_cache }}/tiktoken
        run: scripts/check-crate-tokens.test.sh

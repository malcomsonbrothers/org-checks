# Org no-stubs check, a candidate required workflow for an org ruleset's "Require workflows to
# pass" rule (pinned commit), like file-lengths.yml. Skeletons live on swarm and item branches; a
# stub that reaches the default branch, staging or <project>/staging (one folder segment) panics
# for testers, agents' end-to-end runs and users. So on pull requests into those branches it reads
# every file of the merge commit and fails on a Rust todo!() or unimplemented!() call in a .rs file
# (not in a comment), or the stub marker (see scripts/check-no-stubs.sh) in any text file but
# Markdown.
#
# The repository's optional .no-stubs (and projects/<p>/.no-stubs) exempts generated or vendored
# paths. It may only shrink against the pull request base: a new exempt line fails unless the pull
# request has the no-stubs-exception label (then close and reopen the pull request to re-run). In
# a sync (see file-lengths.yml), lines the default branch tip already has also count as old.
#
# The engine below is scripts/check-no-stubs.sh, embedded like file-lengths.yml's so the job
# fetches nothing and the ruleset's pinned commit pins the engine too. After editing the script,
# paste it back between <<'ENGINE' and ENGINE indented ten spaces; tests.yml fails while the two
# differ.

name: No Stubs

on:
  pull_request:
    # labeled/unlabeled re-run it when this workflow runs directly (this repository). An org
    # ruleset ignores types and runs it only on opened, synchronize and reopened, so there, after
    # changing the no-stubs-exception label, re-run the failed check: it reads the labels live.
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  no-stubs:
    # endsWith also matches a/b/staging; the shell gate below keeps only one folder segment.
    if: github.event.pull_request.base.ref == github.event.repository.default_branch || github.event.pull_request.base.ref == 'staging' || endsWith(github.event.pull_request.base.ref, '/staging')
    runs-on: ${{ fromJSON((github.event.repository.visibility == 'private' || github.event.repository.visibility == 'internal') && '["self-hosted", "Linux", "light"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 15
    steps:
      # A new clone in the job's temporary directory, never the runner's reused workspace
      # (see scripts/fresh-clone.sh, embedded like the engine: paste it back after editing).
      - name: Fetch the pull request into a fresh clone
        env:
          FRESH_CLONE_TOKEN: ${{ github.token }}
          PR_MERGE: ${{ github.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          clone="$RUNNER_TEMP/fresh-clone.sh"
          cat > "$clone" <<'CLONE'
          #!/usr/bin/env bash
          # Fetches the pull request into a new, empty repository for a required workflow, instead of
          # trusting the runner's workspace. The self-hosted runners are shared and keep each repository's
          # workspace between jobs, so another job may leave it blob-less (filtered), shallow or otherwise
          # altered; actions/checkout reuses such a .git, a later read needs a blob the job can no longer
          # fetch, and the check fails. Needs only bash and git (2.32 or later).
          #   fresh-clone.sh DEST URL [--depth N] [--checkout COMMIT] REFSPEC...
          # DEST is removed and created afresh, with origin at URL, then REFSPECs are fetched in one go:
          # never with a filter, with full history unless --depth limits it. --checkout detaches HEAD at
          # COMMIT with its files; without it there is no working tree checkout. FRESH_CLONE_TOKEN, when
          # set, authenticates that one fetch through a header exported only for it, so it is never
          # written to .git/config or any process's command line. The runner user's global and system git config are ignored.
          set -euo pipefail
          export LC_ALL=C GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 GIT_TERMINAL_PROMPT=0
          unset GIT_DIR GIT_WORK_TREE GIT_INDEX_FILE GIT_OBJECT_DIRECTORY GIT_ALTERNATE_OBJECT_DIRECTORIES \
            GIT_CONFIG_PARAMETERS GIT_CONFIG_COUNT
          fail() { echo "fresh-clone: $*" >&2; exit 2; }
          usage="usage: fresh-clone.sh DEST URL [--depth N] [--checkout COMMIT] REFSPEC..."

          [ $# -ge 2 ] || fail "$usage"
          dest=$1 url=$2; shift 2
          depth=() commit=""
          while [ $# -gt 0 ]; do
            case $1 in
              --depth) [[ ${2:-} =~ ^[1-9][0-9]*$ ]] || fail "--depth needs a positive number"; depth=(--depth "$2"); shift 2 ;;
              --checkout) [ -n "${2:-}" ] || fail "$usage"; commit=$2; shift 2 ;;
              -*) fail "$usage" ;;
              *) break ;;
            esac
          done
          [ $# -gt 0 ] || fail "$usage"

          rm -rf "$dest"
          git init -q "$dest"
          git -C "$dest" remote add origin "$url"
          # The header is exported only around the fetch, never passed as an argument: the runners' users
          # share /proc, where any process's command line is readable but its environment is not.
          # printf and echo are builtins, so the token is in no command line here either.
          if [ -n "${FRESH_CLONE_TOKEN:-}" ]; then
            basic=$(printf 'x-access-token:%s' "$FRESH_CLONE_TOKEN" | base64 | tr -d '\n')
            echo "::add-mask::$basic"
            export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraHeader GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $basic"
          fi
          fetched=0
          git -C "$dest" fetch --quiet --no-tags --no-recurse-submodules "${depth[@]}" origin "$@" && fetched=1
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0 basic
          [ "$fetched" -eq 1 ] || fail "could not fetch $* from $url"
          if [ -n "$commit" ]; then git -C "$dest" checkout --quiet --detach "$commit" -- ||
            fail "could not check out $commit"; fi

          # The new repository must be complete: no promisor remote or filter, and full history unless
          # --depth asked for less (a short history fetched with --depth is not shallow).
          if git -C "$dest" config --get-regexp '^(remote\..*\.(promisor|partialclonefilter)|extensions\.partialclone)$'; then
            fail "the new clone is a partial clone"
          fi
          if [ ${#depth[@]} -eq 0 ] && [ "$(git -C "$dest" rev-parse --is-shallow-repository)" != false ]; then
            fail "the new clone is shallow"
          fi
          echo "fresh-clone: fetched $* into $dest${depth[*]:+ (${depth[*]})}${commit:+, checked out $commit}"
          CLONE
          chmod +x "$clone"
          # The engine reads the pull request's merge commit, and the .no-stubs files of its first
          # parent (the base) and of the default branch, never with a filter. Two commits of each are
          # enough (the merge and its parents), except for a possible sync (see file-lengths.yml), where
          # the engine needs full history; it treats a shallow clone as no sync. Only a change to a
          # .no-stubs can need a sync, so only then is the clone made again in full, once the base is known.
          refs=("+$PR_MERGE:refs/check/merge" "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH")
          depth=(--depth 2)
          "$clone" "$RUNNER_TEMP/pr" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "${depth[@]}" --checkout "$PR_MERGE" "${refs[@]}"
          # Compare with the base branch tip the merge was built on, never the event's base.sha, which
          # can be older (see scripts/current-base.sh, embedded like the clone script).
          base_of="$RUNNER_TEMP/current-base.sh"
          cat > "$base_of" <<'BASE'
          #!/usr/bin/env bash
          # Prints the base a required workflow compares a pull request with: the first parent of the pull
          # request's merge commit (github.sha), the base branch tip GitHub built that merge on. Never the
          # event's pull_request.base.sha: a reopened pull request keeps the base.sha from when it was
          # opened while GitHub rebuilds the merge on the current tip, so comparing with it blames the pull
          # request for rows the base branch gained since. Run it in the clone, after fetching the merge
          # with its parents (depth 2 or more). Needs only bash and git.
          #   current-base.sh MERGE
          # Fails (exit 2) unless MERGE is a commit with exactly two parents, the first present with its tree.
          set -euo pipefail
          fail() { echo "current-base: $*" >&2; exit 2; }
          [ $# -eq 1 ] && [ -n "$1" ] || fail "usage: current-base.sh MERGE"
          merge=$(git rev-parse --verify --quiet "$1^{commit}") || fail "$1 is not a commit in this clone"
          read -r -a ps < <(git rev-list --parents -n 1 "$merge" || :)
          [ "${#ps[@]}" -eq 3 ] || fail "$merge is not a two-parent merge commit, or its parents were not fetched"
          git cat-file -e "${ps[1]}^{tree}" 2>/dev/null || fail "the first parent ${ps[1]} of $merge was not fetched"
          echo "${ps[1]}"
          BASE
          chmod +x "$base_of"
          base=$(cd "$RUNNER_TEMP/pr" && "$base_of" "$PR_MERGE")
          if [ "$BASE_REF" != "$DEFAULT_BRANCH" ] && [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ] &&
            ! git -C "$RUNNER_TEMP/pr" diff --quiet "$base" "$PR_MERGE" -- .no-stubs ':(glob)projects/*/.no-stubs'; then
            "$clone" "$RUNNER_TEMP/pr" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" --checkout "$PR_MERGE" "${refs[@]}"
          fi
          echo "CURRENT_BASE=$base" >> "$GITHUB_ENV"
          echo "Comparing with $base, the first parent of the merge commit $PR_MERGE"

      # The label as it is now, read through the API, not from the event: gh pr create --label adds
      # labels just after the opened event, and a re-run replays the original event.
      - name: Read the no-stubs-exception label
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          labels=$(gh api "repos/$REPO/issues/$PR_NUMBER/labels" --paginate --jq '.[].name')
          if grep -qxF 'no-stubs-exception' <<<"$labels"; then value=true; else value=false; fi
          echo "NO_STUBS_EXCEPTION=$value" >> "$GITHUB_ENV"
          echo "no-stubs-exception label on the pull request: $value"

      - name: Check for implementation stubs
        working-directory: ${{ runner.temp }}/pr
        env:
          NO_STUBS_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          NO_STUBS_BASE_REF: ${{ github.event.pull_request.base.ref }}
          NO_STUBS_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          NO_STUBS_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          NO_STUBS_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$NO_STUBS_BASE_REF" != "$NO_STUBS_DEFAULT_BRANCH" ] && ! [[ $NO_STUBS_BASE_REF =~ ^([^/]+/)?staging$ ]]; then
            echo "no-stubs: $NO_STUBS_BASE_REF is not a protected branch: nothing to check"; exit 0
          fi
          # The sync rule the engine runs from beside it (scripts/sync-tip.sh, embedded like the engine).
          cat > "$RUNNER_TEMP/sync-tip.sh" <<'SYNC'
          #!/usr/bin/env bash
          # Tells a sync pull request apart for the shrink-only config rules of commit-size, file-lengths and
          # crate-tokens, which run it from beside their engine. A sync's head comes from this repository (REPO),
          # its head ref is the default branch, or <p>/sync/<x> into BASE_REF <p>/staging where BASE has
          # projects/<p>/, and in a full clone TIP has origin/<default>'s tip while BASE does not. Only then do
          # that tip's own config lines count as old too; anything beyond them still needs the exception label.
          #   sync-tip.sh DEFAULT REPO HEAD_REPO BASE_REF HEAD_REF BASE [TIP]
          # Without TIP: exit 0 if the refs allow a sync, else 1. With TIP: prints the tip in a sync, else nothing.
          set -euo pipefail
          [ $# -eq 6 ] || [ $# -eq 7 ] || { echo "usage: sync-tip.sh DEFAULT REPO HEAD_REPO BASE_REF HEAD_REF BASE [TIP]" >&2; exit 2; }
          d=$1 h=$5 base=$6
          if [[ $4 =~ ^([A-Za-z0-9_-][A-Za-z0-9._-]*)/staging$ ]] && [[ $h == "${BASH_REMATCH[1]}"/sync/?* ]] &&
            [ -n "$base" ] && [ "$(git cat-file -t "$base:projects/${4%/staging}" 2>/dev/null)" = tree ]; then h=$d; fi
          if [ -z "$d" ] || [ "$h" != "$d" ] || [ -z "$2" ] || [ "$3" != "$2" ]; then [ $# -eq 7 ] && exit 0; exit 1; fi
          [ $# -eq 7 ] || exit 0
          t=$(git rev-parse -q --verify "refs/remotes/origin/$d^{commit}") || exit 0
          [ "$(git rev-parse --is-shallow-repository)" = false ] && git merge-base --is-ancestor "$t" "$7" || exit 0
          [ -n "$base" ] && git merge-base --is-ancestor "$t" "$base" 2>/dev/null && exit 0
          echo "$t"
          SYNC
          chmod +x "$RUNNER_TEMP/sync-tip.sh"
          engine="$RUNNER_TEMP/check-no-stubs.sh"
          cat > "$engine" <<'ENGINE'
          #!/usr/bin/env bash
          # Org-wide refusal of implementation stubs. Needs only bash, git, grep, awk and xargs. Never skips: without
          # .no-stubs nothing is exempt.
          #   check-no-stubs.sh             tracked and untracked files in the working tree
          #   check-no-stubs.sh --ci BASE   the working tree, and .no-stubs may only shrink (see CI below)
          # A stub is a Rust todo!() or unimplemented!() call in a .rs file, or the stub marker in any text file but
          # Markdown (md, markdown, mdx), where docs describe it. The marker is TODO and STUB joined by a hyphen; this
          # file spells it in two parts so it never carries it. A Rust match after // or /* on its line is a comment
          # that only names the macro, so it passes. A zero or missing BASE: the merge-base with
          # NO_STUBS_DEFAULT_BRANCH, origin/HEAD, main or master. In a sync (see sync-tip.sh, beside this engine)
          # the default branch's .no-stubs lines count as old too. NO_STUBS_EXCEPTION=true (the PR label) allows new lines.
          # .no-stubs lines (# starts a comment):   exempt <glob>
          # Globs: * is one path segment, ** any depth, others literal. projects/<p>/.no-stubs paths are folder-relative.
          set -euo pipefail
          export LC_ALL=C

          # What counts as a stub, fixed org-wide: no repository can change it.
          marker='TODO''-STUB'
          rust='(^|[^A-Za-z0-9_])(todo|unimplemented)![ '$'\t'']*[({[]'
          docs="md markdown mdx"

          cd "$(git rev-parse --show-toplevel)"
          config=.no-stubs
          tmp=$(mktemp -d); trap 'rm -rf "$tmp"' EXIT
          fail() { echo "no-stubs: $*" >&2; exit 2; }
          is_zero() { case ${1:-0} in *[!0]*) return 1 ;; *) return 0 ;; esac; }
          ext='function ext(p) { sub(/.*\//, "", p); sub(/^\.+/, "", p); if (p !~ /\.[^.]+$/) return ""; sub(/.*\./, "", p); return tolower(p) }'

          # Prints the merge-base of TIP with the default branch, or nothing.
          fallback_base() {
            local b d=${NO_STUBS_DEFAULT_BRANCH:-}
            for b in ${d:+"origin/$d" "$d"} "$(git symbolic-ref -q --short refs/remotes/origin/HEAD || :)" origin/main origin/master; do
              if [ -n "$b" ] && git rev-parse -q --verify "$b^{commit}" >/dev/null; then git merge-base "$1" "$b" 2>/dev/null || :; return; fi
            done
          }

          # Turns a .no-stubs text (stdin) at path CFG, with globs relative to folder PRE, into rule records:
          #   E regex glob config (repo exempt) | X error
          parse_rules() {
            awk -v cfg="$1" -v pre="$2" -v ref="$3" '
              function glob_re(g,   r, c, i) {
                for (i = 1; i <= length(g); i++) { c = substr(g, i, 1)
                  if (c == "*" && substr(g, i, 3) == "**/") { r = r "(.*/)?"; i += 2 }
                  else if (c == "*" && substr(g, i, 2) == "**") { r = r ".*"; i++ }
                  else if (c == "*") r = r "[^/]*"; else if (c == "?") r = r "[^/]"
                  else if (index("\\.[]()+{}|^$", c)) r = r "\\" c; else r = r c
                }
                return "^" r "$"
              }
              { sub(/\r$/, "") }
              /^[ \t]*(#|$)/ { next }
              $1 == "exempt" && NF == 2 { print "E " glob_re(pre $2) " " $2 " " cfg; next }
              { print "X " ref cfg ":" NR ": unknown or malformed line (only exempt <glob> is allowed): " $0 }'
          }

          # Prints the rule records of .no-stubs and each projects/<p>/.no-stubs at commit REF (empty: the working tree).
          rules_at() {
            local f
            if [ -z "$1" ]; then printf '%s\n' "$config" projects/*/"$config"
            else git ls-tree -r --name-only "$1" -- "$config" projects; fi |
              awk '/^(projects\/[A-Za-z0-9_-][A-Za-z0-9._-]*\/)?\.no-stubs$/' | while IFS= read -r f; do
                if [ -z "$1" ]; then
                  if [ -f "$f" ]; then parse_rules "$f" "${f%"$config"}" "" < "$f"; fi
                else git show "$1:$f" | parse_rules "$f" "${f%"$config"}" "$1:"; fi
              done
          }

          ci=0
          case ${1:-} in
            --ci) ci=1; [ $# -le 2 ] || fail "usage: check-no-stubs.sh [--ci BASE]" ;;
            '') ;;
            *) fail "usage: check-no-stubs.sh [--ci BASE]" ;;
          esac

          rules_at "" > "$tmp/rules"
          status=0
          if grep -q '^X ' "$tmp/rules"; then sed -n 's/^X /[FAIL] /p' "$tmp/rules"; status=1; fi

          # Every regular file that is not exempt, split into Rust files and files that may carry the marker.
          git ls-files -z --cached --others --exclude-standard | tr '\0' '\n' | sort -u |
            awk -v rules="$tmp/rules" 'BEGIN { while ((getline r < rules) > 0) { split(r, w, " "); if (w[1] == "E") ex[w[2]] = 1 } }
              { for (re in ex) if ($0 ~ re) next; print }' | while IFS= read -r f; do
              if [ -f "$f" ] && [ ! -L "$f" ]; then printf '%s\n' "$f"; fi
            done > "$tmp/files"
          awk -v docs="$docs" -v rs="$tmp/rs" -v txt="$tmp/txt" "$ext"'
            BEGIN { n = split(docs, d, " "); for (i = 1; i <= n; i++) doc[d[i]] = 1; printf "" > rs; printf "" > txt }
            { e = ext($0) } e == "rs" { print > rs } !(e in doc) { print > txt }' "$tmp/files"

          # Files with a candidate line (grep -I skips binaries), then each such line, dropping Rust comments.
          { tr '\n' '\0' < "$tmp/rs" | xargs -0 -r grep -I -l -E -e "$rust" -- || :; } > "$tmp/hits"
          { tr '\n' '\0' < "$tmp/txt" | xargs -0 -r grep -I -l -F -e "$marker" -- || :; } >> "$tmp/hits"
          sort -u "$tmp/hits" | sed 's|^|./|' | tr '\n' '\0' |
            xargs -0 -r awk -v docs="$docs" -v rust="$rust" -v marker="$marker" "$ext"'
              BEGIN { n = split(docs, d, " "); for (i = 1; i <= n; i++) doc[d[i]] = 1 }
              FNR == 1 { p = substr(FILENAME, 3); e = ext(p) }
              { sub(/\r$/, ""); why = "" }
              e == "rs" && match($0, rust) && substr($0, 1, RSTART) !~ /\/[\/*]/ {
                why = substr($0, RSTART, RLENGTH); sub(/^[^a-z]*/, "", why); sub(/!.*/, "", why); why = why "!() stub" }
              why == "" && !(e in doc) && index($0, marker) { why = "stub marker" }
              why != "" { t = $0; sub(/^[ \t]+/, "", t); if (length(t) > 160) t = substr(t, 1, 157) "..."
                print "[FAIL] " p ":" FNR ": " why ": " t }' > "$tmp/stubs"
          found=$(awk 'END { print NR }' "$tmp/stubs")
          cat "$tmp/stubs"
          echo "no-stubs: $(awk 'END { print NR }' "$tmp/files") file(s) checked, $found stub(s)"
          if [ "$found" -gt 0 ]; then
            status=1
            echo "no-stubs: implement each stub before it reaches a protected branch. Generated or vendored paths go in" \
              ".no-stubs as exempt <glob>; a reviewer allows a new line with the no-stubs-exception label, then closes and reopens the pull request."
          fi

          # CI: each .no-stubs may only shrink against BASE, and in a sync the default branch tip.
          if [ "$ci" -eq 1 ]; then
            base=${2:-}
            if is_zero "$base" || ! git cat-file -e "$base^{commit}" 2>/dev/null; then base=$(fallback_base HEAD); fi
            engine_dir=$(cd "$(dirname "${BASH_SOURCE[0]:-.}")" && pwd)
            [ -x "$engine_dir/sync-tip.sh" ] || fail "sync-tip.sh is missing beside the engine"
            sync=$("$engine_dir/sync-tip.sh" "${NO_STUBS_DEFAULT_BRANCH:-}" "${NO_STUBS_REPO:-}" "${NO_STUBS_HEAD_REPO:-}" \
              "${NO_STUBS_BASE_REF:-}" "${NO_STUBS_HEAD_REF:-}" "$base" HEAD)
            for r in "$base" "$sync"; do [ -z "$r" ] || rules_at "$r"; done | grep '^E ' > "$tmp/old-rules" || true
            awk 'FILENAME == ARGV[1] { old[$2 " " $4] = 1; next } $1 == "E" && !(($2 " " $4) in old) { print $4 " new exempt line " $3 }' \
              "$tmp/old-rules" "$tmp/rules" > "$tmp/added"
            if [ -s "$tmp/added" ]; then
              if [ "${NO_STUBS_EXCEPTION:-}" = true ]; then
                sed 's/^[^ ]* /no-stubs: allowed by the no-stubs-exception label: /' "$tmp/added"
              else
                sed 's/^\([^ ]*\) /[FAIL] \1: /' "$tmp/added"
                echo "no-stubs: .no-stubs may only shrink. A reviewer allows an addition by" \
                  "putting the no-stubs-exception label on the pull request, then closing and reopening it."
                status=1
              fi
            fi
          fi

          [ "$status" -eq 0 ] && echo "no-stubs: ok" || echo "no-stubs: see .no-stubs and scripts/check-no-stubs.sh"
          exit "$status"
          ENGINE
          chmod +x "$engine"
          status=0
          out=$("$engine" --ci "$CURRENT_BASE" 2>&1) || status=$?
          printf '%s\n' "$out"
          printf '%s\n' "$out" | sed -n -e 's/%/%25/g' \
            -e "s/^\[FAIL\] \([^:]*\):\([0-9][0-9]*\): \(.*\)$/::error file=\1,line=\2,title=no-stubs::\3/p" \
            -e "s/^\[FAIL\] \([^:]*\): \(.*\)$/::error file=\1,title=no-stubs::\2/p" \
            -e "s/^\[FAIL\] \([^:]*\)$/::error title=no-stubs::\1/p"
          {
            echo "## No stubs"
            if [ "$status" -eq 0 ]; then echo "No implementation stubs."; else
              echo "Failures (exit $status). Implement each stub before the pull request merges; stubs belong on"
              echo "swarm and item branches only. Generated or vendored paths go in .no-stubs as exempt <glob>; a"
              echo "reviewer allows a new line with the no-stubs-exception label, then closes and reopens the pull"
              echo "request to re-run this check (see the malcomsonbrothers/org-checks README)."
            fi
            echo '```'
            printf '%s\n' "$out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

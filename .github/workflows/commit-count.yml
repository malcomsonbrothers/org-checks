# Org commit count check, a candidate required workflow for an org ruleset's "Require workflows
# to pass" rule (pinned commit), like commit-size.yml. GitHub will not rebase-merge a pull
# request with too many commits (100 rebased, 300 refused), so a pull request into the default
# branch, staging or <project>/staging (one folder segment) may hold at most 95. The
# commit-count-exception label allows more; required workflows ignore labeled events, so close
# and reopen the pull request to re-run.
# It reads only the event and holds no credentials.

name: Commit Count

on:
  pull_request:
    # labeled/unlabeled re-run it when this workflow runs directly (this repository). An org
    # ruleset ignores types and runs it only on opened, synchronize and reopened, so there, after
    # changing the commit-count-exception label, re-run the failed check: it reads the labels live.
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  issues: read
  pull-requests: read

jobs:
  commit-count:
    # endsWith also matches a/b/staging; the shell gate below keeps only one folder segment.
    if: github.event.pull_request.base.ref == github.event.repository.default_branch || github.event.pull_request.base.ref == 'staging' || endsWith(github.event.pull_request.base.ref, '/staging')
    runs-on: ${{ fromJSON((github.event.repository.visibility == 'private' || github.event.repository.visibility == 'internal') && '["self-hosted", "Linux", "light"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 2
    steps:
      # The label as it is now, read through the API, not from the event: gh pr create --label adds
      # labels just after the opened event, and a re-run replays the original event.
      - name: Read the commit-count-exception label
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          labels=$(gh api "repos/$REPO/issues/$PR_NUMBER/labels" --paginate --jq '.[].name')
          if grep -qxF 'commit-count-exception' <<<"$labels"; then value=true; else value=false; fi
          echo "EXCEPTION=$value" >> "$GITHUB_ENV"
          echo "commit-count-exception label on the pull request: $value"

      - name: Count the pull request's commits
        env:
          COMMITS: ${{ github.event.pull_request.commits }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ "$BASE_REF" != "$DEFAULT_BRANCH" ] && ! [[ $BASE_REF =~ ^([^/]+/)?staging$ ]]; then
            echo "commit-count: $BASE_REF is not a staging branch: nothing to check"; exit 0
          fi
          limit=95
          if [ "$COMMITS" -le "$limit" ]; then
            echo "commit-count: $COMMITS commit(s), limit $limit: ok"
          elif [ "$EXCEPTION" = true ]; then
            echo "commit-count: $COMMITS commits, limit $limit: allowed by the commit-count-exception label"
          else
            msg="$COMMITS commits, limit $limit. GitHub will not rebase-merge this many commits; release more often or split the PR"
            echo "::error title=commit-count::$msg"
            echo "## Commit count" >> "$GITHUB_STEP_SUMMARY"
            echo "$msg. A reviewer can allow it with the commit-count-exception label, then close and reopen the pull request." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
